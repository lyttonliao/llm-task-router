[project]
name = "llm-task-router"
version = "0.1.0"
description = "Cost/quality-aware router: classifies a task and dispatches it to the cheapest model tier that clears a quality floor."
requires-python = ">=3.14"
dependencies = []

[project.scripts]
llm-route = "llm_task_router.cli:main"
llm-chat = "llm_task_router.repl:main"

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_classes = "NoPytestTestClasses"
