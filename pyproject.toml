[project]
name = "llm-task-router"
version = "0.1.0"
description = "Cost/quality-aware router: classifies a task and dispatches it to the cheapest model tier that clears a quality floor."
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_classes = "NoPytestTestClasses"
